[project]
name = "kid-events-radar"
version = "0.1.0"
description = "A joyful weekend radar of fun, nearby kids' events for the family"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
]

[project.scripts]
kid-events-radar = "kid_events_radar.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kid_events_radar"]
